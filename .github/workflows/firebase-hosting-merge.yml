# Deploy to Firebase Hosting on merge to main branch
# Monorepo: Angular app lives in angular_app/

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex_app
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -file-line-error -jobname=ShawalMbalireCV"

      - name: Copy CV to Angular public directory
        run: |
          mkdir -p angular_app/public/documents
          if [ -f ShawalMbalireCV.pdf ]; then
            cp ShawalMbalireCV.pdf angular_app/public/documents/MbalireShawalCV.pdf
          else
            cp latex_app/ShawalMbalireCV.pdf angular_app/public/documents/MbalireShawalCV.pdf
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build:prod
        env:
          NODE_ENV: production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHAWALMBALIRECOM }}
          channelId: live
          projectId: shawalmbalirecom
          entryPoint: ./angular_app

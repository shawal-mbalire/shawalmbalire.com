# CI pipeline for the monorepo
# Builds and tests both Angular app and LaTeX CV

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  latex_build:
    name: LaTeX CV Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex_app
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -file-line-error -jobname=ShawalMbalireCV"

      - name: Upload CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: latex_app/ShawalMbalireCV.pdf

  angular_build:
    name: Angular Build & Test
    needs: latex_build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CV artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: angular_app/public/documents/

      - name: Rename PDF
        run: |
          mv public/documents/ShawalMbalireCV.pdf public/documents/MbalireShawalCV.pdf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Build production bundle
        run: bun run build:prod
        env:
          NODE_ENV: production

      - name: Run tests
        run: bun run test

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: angular_app/dist/
          retention-days: 7

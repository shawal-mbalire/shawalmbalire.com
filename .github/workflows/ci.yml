# CI pipeline for the monorepo
# Builds and tests both Angular app and LaTeX CV

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  latex_build:
    name: LaTeX CV Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex_app
          args: "-xelatex -interaction=nonstopmode -halt-on-error -file-line-error -jobname=ShawalMbalireCV"

  angular_build:
    name: Angular Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex_app
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error -file-line-error -jobname=ShawalMbalireCV"

      - name: Locate and Copy CV
        run: |
          mkdir -p angular_app/public/documents
          echo "Searching for ShawalMbalireCV.pdf..."
          ls -R
          PDF_PATH=$(find . -name "ShawalMbalireCV.pdf" | head -n 1)
          if [ -n "$PDF_PATH" ]; then
            echo "Found PDF at: $PDF_PATH"
            cp "$PDF_PATH" angular_app/public/documents/MbalireShawalCV.pdf
          else
            echo "Error: ShawalMbalireCV.pdf not found anywhere!"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Build production bundle
        run: bun run build:prod
        env:
          NODE_ENV: production

      - name: Run tests
        run: bun run test

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: angular_app/dist/
          retention-days: 7
